name: Generate and publish

on:
  workflow_dispatch:
  schedule:
    - cron:  '*/30 * * * *'
  

jobs:
  generate:
    name: Generate and publish
    runs-on: ubuntu-latest
    environment: pac-generator
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Set up Go 1.18.2
        uses: actions/setup-go@v5
        with:
          go-version: 1.18.2

      - name: Generate and publish
        run: go run main.go
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: x100x-dev/pac-generator

